name: sightai
description: "A tool for helping people with visual impairments identify scenes when other accessibility tools are not available through the integration of artificial intelligence"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
    sdk: ^3.11.4

dependencies:
    flutter:
        sdk: flutter
    camera: ^0.12.1
    provider: ^6.0.5
    google_vision: ^2.0.0+10
    flutter_dotenv: ^6.0.1
    firebase_core: ^5.1.0
    firebase_ai: ^5.1.0
    firebase_auth: ^7.0.1
    cloud_firestore: ^7.1.0
    image_gallery_saver_plus: ^5.1.1
    image_picker: ^1.1.2
    web: ^1.1.1
    flutter_tts: ^4.2.5
    speech_to_text: ^7.0.0
    firebase_app_check: ^0.5.1
    shared_preferences: ^2.5.6

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
flutter:
    uses-material-design: true
